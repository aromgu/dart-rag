services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dart_rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dart_rag}
      POSTGRES_USER: ${POSTGRES_USER:-dart_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dart_rag_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dart_rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dart_rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dart_rag_pgdata:
