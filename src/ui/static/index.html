<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>dart-rag — 공시 질의응답</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Flowbite/Tailwind class 기반 다크모드 - OS 설정과 무관하게 기본은 라이트,
  // <html> 태그에 'dark' class가 붙어야만 dark: 유틸리티가 적용된다.
  tailwind.config = { darkMode: "selector" };
</script>
<link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />
<style>
  .mono { font-variant-numeric: tabular-nums; }
  #chatArea::-webkit-scrollbar { width: 8px; }
  #chatArea::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
  .dark #chatArea::-webkit-scrollbar-thumb { background: #374151; }
  @keyframes bounce-dot { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .thinking-dot { animation: bounce-dot 1.1s infinite ease-in-out; }
  @media (prefers-reduced-motion: reduce) { .thinking-dot { animation: none; opacity: .6; } }
</style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 antialiased">

<div class="flex flex-col h-screen max-w-4xl mx-auto w-full">

  <!-- Navbar -->
  <nav class="bg-white border-b border-gray-200 dark:bg-gray-800 dark:border-gray-700">
    <div class="flex items-center justify-between px-4 py-3">
      <div class="flex items-baseline gap-2">
        <span class="self-center text-xl font-semibold whitespace-nowrap dark:text-white">dart-rag</span>
        <span class="hidden sm:inline text-xs text-gray-500 dark:text-gray-400">KOSPI 100 사업보고서 질의응답</span>
      </div>
      <div class="flex items-center gap-2">
        <span id="statusBadge" class="inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300">
          <span id="statusDotEl" class="w-1.5 h-1.5 rounded-full bg-gray-400"></span>
          <span id="statusText">연결 확인 중</span>
        </span>
        <select id="companySelect" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
          <option value="">전체 회사</option>
        </select>
        <button id="themeToggle" type="button" class="text-gray-500 hover:bg-gray-100 focus:ring-4 focus:ring-gray-200 rounded-lg text-sm p-2.5 dark:text-gray-400 dark:hover:bg-gray-700" title="테마 전환" aria-label="테마 전환">
          <svg id="iconMoon" class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
          <svg id="iconSun" class="w-4 h-4 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- Chat area -->
  <main id="chatArea" class="flex-1 overflow-y-auto px-4 py-6 space-y-6">
    <div id="emptyState" class="h-full flex flex-col items-center justify-center text-center px-4">
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">코스피 100대 기업 재무 정보 검색</h1>
      <p class="text-gray-500 dark:text-gray-400 max-w-md mb-5 text-sm">
        사업보고서 원문을 근거로 정확한 수치와 출처를 함께 보여드려요.
      </p>
      <div class="flex flex-wrap gap-2 justify-center">
        <button class="example-chip px-4 py-1.5 text-xs font-medium text-gray-700 bg-white border border-gray-300 rounded-full hover:bg-gray-100 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-600" data-q="삼성전자의 매출액은 얼마인가요?">삼성전자의 매출액은 얼마인가요?</button>
        <button class="example-chip px-4 py-1.5 text-xs font-medium text-gray-700 bg-white border border-gray-300 rounded-full hover:bg-gray-100 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-600" data-q="하이브의 영업이익은 얼마인가요?">하이브의 영업이익은 얼마인가요?</button>
        <button class="example-chip px-4 py-1.5 text-xs font-medium text-gray-700 bg-white border border-gray-300 rounded-full hover:bg-gray-100 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-600" data-q="삼양식품의 매출액은 얼마인가요?">삼양식품의 매출액은 얼마인가요?</button>
        <button class="example-chip px-4 py-1.5 text-xs font-medium text-gray-700 bg-white border border-gray-300 rounded-full hover:bg-gray-100 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-600" data-q="대한항공의 당기순이익은 얼마인가요?">대한항공의 당기순이익은 얼마인가요?</button>
      </div>
    </div>
  </main>

  <!-- Composer -->
  <form id="composerForm" class="flex items-center gap-2 p-4 border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
    <input id="questionInput" type="text" autocomplete="off"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 flex-1 min-w-0 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
      placeholder="질문을 입력하세요 (예: 삼성전자의 매출액은 얼마인가요?)" />
    <button id="sendBtn" type="submit" class="shrink-0 whitespace-nowrap text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800 disabled:opacity-50 disabled:cursor-not-allowed">
      전송
    </button>
  </form>
</div>

<script>
(function () {
  const API_BASE = window.location.origin;
  const chatArea = document.getElementById("chatArea");
  const emptyState = document.getElementById("emptyState");
  const form = document.getElementById("composerForm");
  const input = document.getElementById("questionInput");
  const sendBtn = document.getElementById("sendBtn");
  const companySelect = document.getElementById("companySelect");
  const statusDotEl = document.getElementById("statusDotEl");
  const statusText = document.getElementById("statusText");
  const themeToggle = document.getElementById("themeToggle");
  const iconMoon = document.getElementById("iconMoon");
  const iconSun = document.getElementById("iconSun");

  let history = []; // [{question, answer, corp_name}]

  themeToggle.addEventListener("click", () => {
    const isDark = document.documentElement.classList.toggle("dark");
    iconMoon.classList.toggle("hidden", isDark);
    iconSun.classList.toggle("hidden", !isDark);
  });

  async function checkHealth() {
    try {
      const res = await fetch(`${API_BASE}/health`);
      if (!res.ok) throw new Error();
      statusDotEl.className = "w-1.5 h-1.5 rounded-full bg-green-500";
      statusText.textContent = "연결됨";
    } catch {
      statusDotEl.className = "w-1.5 h-1.5 rounded-full bg-red-500";
      statusText.textContent = "연결 안 됨";
    }
  }

  async function loadCompanies() {
    try {
      const res = await fetch(`${API_BASE}/companies`);
      const names = await res.json();
      for (const name of names) {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        companySelect.appendChild(opt);
      }
    } catch {
      /* 회사 목록 실패해도 전체 질의는 계속 가능하니 조용히 무시 */
    }
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function highlightNumbers(text) {
    return escapeHtml(text).replace(/[\d,]{4,}/g, (m) => `<span class="mono font-semibold">${m}</span>`);
  }

  function userBubble(question) {
    const wrap = document.createElement("div");
    wrap.className = "flex justify-end";
    wrap.innerHTML = `
      <div class="max-w-[75%] leading-1.5 px-4 py-2.5 bg-blue-600 text-white rounded-s-xl rounded-ee-xl text-sm">
        ${escapeHtml(question)}
      </div>`;
    return wrap;
  }

  function assistantThinking() {
    const wrap = document.createElement("div");
    wrap.className = "flex justify-start";
    wrap.innerHTML = `
      <div class="max-w-[85%] leading-1.5 px-4 py-3 bg-white border border-gray-200 rounded-e-xl rounded-es-xl dark:bg-gray-800 dark:border-gray-700 text-sm text-gray-500 dark:text-gray-400 flex items-center gap-2">
        검색하고 답변을 생성하는 중
        <span class="flex gap-1">
          <span class="thinking-dot w-1.5 h-1.5 rounded-full bg-gray-400" style="animation-delay:0s"></span>
          <span class="thinking-dot w-1.5 h-1.5 rounded-full bg-gray-400" style="animation-delay:.15s"></span>
          <span class="thinking-dot w-1.5 h-1.5 rounded-full bg-gray-400" style="animation-delay:.3s"></span>
        </span>
      </div>`;
    return wrap;
  }

  function assistantAnswer(answerHtml, sources, isError) {
    const wrap = document.createElement("div");
    wrap.className = "flex justify-start w-full";
    const srcCount = sources ? sources.length : 0;

    const bubbleColor = isError
      ? "bg-red-50 border-red-200 dark:bg-red-950 dark:border-red-900"
      : "bg-white border-gray-200 dark:bg-gray-800 dark:border-gray-700";

    wrap.innerHTML = `
      <div class="max-w-[85%] w-full">
        <div class="leading-1.5 px-4 py-3 border ${bubbleColor} rounded-e-xl rounded-es-xl text-sm text-gray-900 dark:text-gray-100">
          ${answerHtml}
        </div>
        ${srcCount ? `
        <button class="src-toggle mt-2 inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full bg-blue-100 text-blue-800 hover:bg-blue-200 dark:bg-blue-900 dark:text-blue-300 dark:hover:bg-blue-800">
          <svg class="chev w-3 h-3 transition-transform" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
          근거자료 ${srcCount}개
        </button>
        <div class="src-panel hidden mt-2 space-y-2">
          ${sources.map((s, i) => `
            <div class="p-3 bg-gray-50 border border-gray-200 rounded-lg dark:bg-gray-700/50 dark:border-gray-600">
              <div class="flex items-center justify-between gap-2 mb-1.5">
                <span class="text-xs font-semibold text-gray-900 dark:text-white truncate">[${i + 1}] ${escapeHtml(s.corp_name)}</span>
                <span class="mono text-xs text-gray-400 dark:text-gray-500 shrink-0">score ${s.score.toFixed(3)}</span>
              </div>
              <div class="text-xs text-gray-500 dark:text-gray-400 mb-1.5">${escapeHtml(s.section_path.join(" > "))}</div>
              <pre class="mono text-[11px] text-gray-600 dark:text-gray-300 bg-white dark:bg-gray-800 rounded p-2 max-h-28 overflow-y-auto whitespace-pre-wrap border border-gray-100 dark:border-gray-700">${escapeHtml(s.text.slice(0, 400))}</pre>
            </div>
          `).join("")}
        </div>` : ""}
      </div>`;

    const toggle = wrap.querySelector(".src-toggle");
    if (toggle) {
      toggle.addEventListener("click", () => {
        const panel = wrap.querySelector(".src-panel");
        const chev = wrap.querySelector(".chev");
        panel.classList.toggle("hidden");
        chev.classList.toggle("rotate-90");
      });
    }
    return wrap;
  }

  async function ask(question) {
    if (emptyState) emptyState.remove();
    chatArea.appendChild(userBubble(question));
    const thinkingEl = assistantThinking();
    chatArea.appendChild(thinkingEl);
    chatArea.scrollTop = chatArea.scrollHeight;

    const corpName = companySelect.value || null;
    try {
      const res = await fetch(`${API_BASE}/ask`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          question,
          corp_name: corpName,
          history: history.map((h) => ({ question: h.question, answer: h.answer, corp_name: h.corp_name })),
        }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail ? JSON.stringify(err.detail) : `HTTP ${res.status}`);
      }
      const data = await res.json();
      thinkingEl.replaceWith(assistantAnswer(highlightNumbers(data.answer), data.sources, false));
      history.push({ question, answer: data.answer, corp_name: corpName });
    } catch (e) {
      thinkingEl.replaceWith(assistantAnswer(`요청 실패: ${escapeHtml(String(e.message || e))}`, [], true));
    }
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    input.value = "";
    sendBtn.disabled = true;
    ask(q).finally(() => { sendBtn.disabled = false; input.focus(); });
  });

  document.querySelectorAll(".example-chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      input.value = chip.dataset.q;
      form.requestSubmit();
    });
  });

  checkHealth();
  loadCompanies();
})();
</script>
</body>
</html>
