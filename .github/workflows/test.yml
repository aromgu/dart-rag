name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: dart_rag
          POSTGRES_USER: dart_rag
          POSTGRES_PASSWORD: dart_rag_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dart_rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: dart_rag
      POSTGRES_USER: dart_rag
      POSTGRES_PASSWORD: dart_rag_dev_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Init DB schema (pgvector extension + tables + HNSW index)
        run: python -m src.db.init_db

      - name: Run tests
        run: pytest tests/ -q
